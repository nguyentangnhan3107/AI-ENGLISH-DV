
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Sử dụng AI tích hợp vào việc học tiếng anh giúp người dùng hiểu rõ hơn cũng như dễ tiếp thu hơn trong việc học.">
    <title>Eng AI For Learn - Học Tiếng Anh Thông Minh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --apple-red: #ff4b4b;
        --apple-red-dark: #d33030;
        --apple-green: #58cc02;
        --apple-green-dark: #46a302;
        --apple-yellow: #ffc800;
        --apple-cream: #fffdfa;
      }
      body { 
        font-family: 'Nunito', sans-serif; 
        background-color: var(--apple-cream);
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden;
      }
      img {
        -webkit-user-drag: none;
        user-select: none;
        -webkit-user-select: none;
        pointer-events: none;
      }
      #root:empty::before {
        content: 'Đang khởi tạo Eng AI For Learn...';
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-weight: 900;
        color: var(--apple-red);
        font-size: 1.2rem;
        animation: pulse 1.5s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      .duo-button-primary {
        background-color: var(--apple-red);
        border-bottom: 5px solid var(--apple-red-dark);
        transition: all 0.1s;
        border-radius: 24px;
      }
      .duo-button-primary:active {
        border-bottom-width: 0;
        transform: translateY(5px);
      }
      .duo-card {
        border: 3px solid #f0f0f0;
        border-bottom: 6px solid #f0f0f0;
        border-radius: 32px;
        background-color: white;
      }
      .apple-float {
        animation: none;
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      .shake-error {
        animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
      }
      @keyframes shake {
        10%, 90% { transform: translate3d(-1px, 0, 0); }
        20%, 80% { transform: translate3d(2px, 0, 0); }
        30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
        40%, 60% { transform: translate3d(4px, 0, 0); }
      }
      .firework {
        position: fixed;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        pointer-events: none;
        z-index: 999;
        animation: firework-animation 2s ease-out forwards;
      }
      @keyframes firework-animation {
        0% { transform: translate(0, 0); opacity: 1; }
        100% { transform: translate(var(--x), var(--y)); opacity: 0; }
      }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
      .custom-scrollbar::-webkit-scrollbar { width: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #e5e5e5; border-radius: 10px; }

      /* Strong keyboard focus and low-vision support when accessibility mode is enabled. */
      body.accessibility-mode :focus-visible {
        outline: 4px solid #005fcc !important;
        outline-offset: 4px !important;
        box-shadow: 0 0 0 3px #ffffff !important;
      }
      body.accessibility-mode button,
      body.accessibility-mode a,
      body.accessibility-mode input,
      body.accessibility-mode select,
      body.accessibility-mode textarea {
        scroll-margin-top: 24px;
      }
      body.accessibility-mode button[disabled] {
        opacity: 0.7;
      }
      body.accessibility-mode .custom-scrollbar::-webkit-scrollbar {
        width: 12px;
      }
      body.accessibility-mode .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #666;
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body class="text-[#4b4b4b] overscroll-none">
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
